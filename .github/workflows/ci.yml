name: ci
on: 
  push: branch [main]
  pull-request:
permissions:
  contents: read
jobs:
  <job id>: 
    runs on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip
             pip install -r services/tasks-api/requirements.txt
     
      - name: Run tests from tasks-api
        working-directory: services/tasks-api
        run: python -m pytest -v

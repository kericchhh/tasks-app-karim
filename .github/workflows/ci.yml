name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]
        python-version: [3.12, 3.11, 3.8]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}} 
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/${{matrix.service}}/requirements.txt

      - name: Run tests
        working-directory: services/${{matrix.service}}
        run: |
          set -o pipefail
          python -m pytest -v -rA 2>&1 | tee test-report.txt
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-py${{matrix.python-version}}-test-report
          path: services/${{matrix.service}}/test-report.txt
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -r services -ll -f json -o reports/bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/bandit-report.json
          if-no-files-found: error

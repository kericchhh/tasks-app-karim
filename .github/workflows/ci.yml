name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]
        python-version: [3.12, 3.11, 3.8]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}} 
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/${{matrix.service}}/requirements.txt

      - name: Run tests
        working-directory: services/${{matrix.service}}
        run: python -m pytest -v

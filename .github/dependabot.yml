version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/services/tasks-api", "/services/title-normalizer"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: ["/services/tasks-api", "/services/title-normalizer"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-image:
        patterns: ["python"]
